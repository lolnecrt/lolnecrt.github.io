<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nikolai Sus — дизайнер интерфейсов</title>
<meta name="description" content="Портфолио Nikolai Sus: концепты, исследования и эксперименты с 3D в браузере.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="stage is-top" id="stage">

  <!-- Картинка-заглушка, пока грузится 3D, сам холст для three.js и затемнение по краям -->
  <div class="poster" aria-hidden="true"></div>
  <canvas class="scene" id="scene" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Слой интерфейса: четыре угла и меню посередине -->
  <div class="ui">
    <header class="corner corner--tl">
      <p class="corner__name">Nikolai Sus</p>
      <p>дизайнер интерфейсов</p>
    </header>

    <div class="corner corner--tr">
      <p id="clock">Петербург</p>
      <p id="wind" hidden></p>
    </div>

    <!-- ========== меню: три ярлыка и то, что под ними открывается ========== -->
    <nav class="xmb" aria-label="Разделы">
      <div class="xmb__row">
        <button class="cat" type="button" data-open="projects" aria-expanded="false" aria-controls="shelf">
          <span class="glass" aria-hidden="true">
            <svg class="ico ico--projects" viewBox="0 0 48 48"><rect class="s1" x="8" y="12" width="24" height="18" rx="3"/><rect class="s2" x="8" y="12" width="24" height="18" rx="3"/><rect class="s3" x="16" y="19" width="24" height="18" rx="3"/></svg>
          </span>
          <span class="cat__name">Проекты</span>
        </button>
        <button class="cat" type="button" data-open="about" aria-haspopup="dialog" tabindex="-1">
          <span class="glass" aria-hidden="true">
            <svg class="ico ico--about" viewBox="0 0 48 48"><path d="M11 38c2-7.5 7-11 13-11s11 3.5 13 11"/><circle cx="24" cy="17" r="7"/></svg>
          </span>
          <span class="cat__name">Обо мне</span>
        </button>
        <button class="cat" type="button" data-open="lab" aria-expanded="false" aria-controls="lab" tabindex="-1">
          <span class="glass" aria-hidden="true">
            <svg class="ico ico--lab" viewBox="0 0 48 48"><line x1="16" y1="14.8" x2="32" y2="18.2"/><line x1="33.2" y1="22" x2="23.8" y2="33"/><line x1="13.4" y1="17.8" x2="19" y2="32.2"/><circle cx="12" cy="14" r="4"/><circle cx="36" cy="19" r="4"/><circle cx="21" cy="36" r="4"/></svg>
          </span>
          <span class="cat__name">Эксперименты</span>
        </button>
      </div>

      <!-- Проекты: карточки стоят по дуге и прокручиваются по кругу -->
      <section class="shelf" id="shelf" aria-label="Проекты" hidden>
        <div class="ring" id="ring">
          <button class="card" type="button" data-sheet="imagine">
            <span class="card__art" aria-hidden="true">
              <svg viewBox="0 0 120 80"><circle cx="50" cy="40" r="31"/><circle class="thin" cx="50" cy="40" r="25"/><circle class="thin" cx="50" cy="40" r="19"/><circle cx="50" cy="40" r="9"/><circle class="dot" cx="50" cy="40" r="1.6"/><path d="M99 10v27l-17 19"/><circle cx="99" cy="10" r="4"/></svg>
            </span>
            <span class="card__text"><span class="card__title">Imagine Club</span><small>концепт · 2026</small></span>
          </button>
          <button class="card" type="button" data-sheet="books">
            <span class="card__art" aria-hidden="true">
              <svg viewBox="0 0 120 80"><rect x="27" y="20" width="12" height="47" rx="2"/><rect x="41" y="13" width="14" height="54" rx="2"/><path class="thin" d="M44 23h8M44 57h8"/><rect x="57" y="24" width="10" height="43" rx="2"/><rect x="70" y="17" width="12" height="50" rx="2" transform="rotate(14 82 67)"/><path d="M17 67h86"/></svg>
            </span>
            <span class="card__text"><span class="card__title">Независимые книжные Петербурга</span><small>исследование · 2026</small></span>
          </button>
        </div>
        <div class="shelf__dots" id="shelf-dots" aria-hidden="true"></div>
      </section>

      <!-- Эксперименты: узлы и связи, как граф в Obsidian. Связи — пары id через двоеточие -->
      <section class="lab" id="lab" aria-label="Эксперименты" data-links="grass:three grass:shaders grass:wind td:shaders" hidden>
        <svg class="lab__links" aria-hidden="true"></svg>
        <button class="node" type="button" data-id="grass" data-size="l" data-sheet="grass"><span class="node__dot"></span><span class="node__label">Трава<small>этот сайт</small></span></button>
        <button class="node" type="button" data-id="td" data-size="m" data-sheet="td"><span class="node__dot"></span><span class="node__label">TouchDesigner<small>скоро</small></span></button>
        <span class="node node--tag" data-id="three" data-size="s" aria-hidden="true"><span class="node__dot"></span><span class="node__label">three.js</span></span>
        <span class="node node--tag" data-id="shaders" data-size="s" aria-hidden="true"><span class="node__dot"></span><span class="node__label">шейдеры</span></span>
        <span class="node node--tag" data-id="wind" data-size="xs" aria-hidden="true"><span class="node__dot"></span><span class="node__label">ветер Петербурга</span></span>
        <p class="lab__hint" aria-hidden="true">узлы можно таскать</p>
      </section>
    </nav>
    <!-- ========== конец меню ========== -->

    <footer class="corner corner--bl">
      <p><a href="https://t.me/iwRRucTBMclts" target="_blank" rel="noopener">Telegram</a> · <a href="mailto:nikolajsus199@gmail.com">nikolajsus199@gmail.com</a></p>
      <p class="soft">портфолио · 2026</p>
    </footer>

    <div class="corner corner--br">
      <p class="hint" id="hint">нажмите в любом месте</p>
      <button class="up" id="scape" type="button" aria-label="Сменить пейзаж" hidden>пейзаж →</button>
      <button class="up" id="up" type="button" hidden>↑ вид сверху</button>
    </div>
  </div>
</div>

<!-- ========== панель: открывается поверх сцены на 80% экрана ========== -->
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <button class="sheet__close" id="sheet-close" type="button" aria-label="Закрыть">×</button>
  <div class="sheet__body" id="sheet-body"></div>
</dialog>

<!-- Тексты панелей. Слева картинка (sheet__media), справа текст (sheet__text). Меняйте прямо здесь -->
<template id="sheet-me">
  <div class="sheet__media sheet__media--photo"><img src="me.jpg" alt="Nikolai Sus" width="860" height="1106"></div>
  <div class="sheet__text">
    <p class="sheet__kicker">обо мне</p>
    <h2>Nikolai Sus</h2>
    <p class="sheet__lead">Дизайнер интерфейсов, магистрант СПбГУ.</p>
    <p class="sheet__status">Ищу стажировку или первую работу</p>
    <p>Коммерческого опыта пока нет — есть учебные и личные проекты, они собраны на этом сайте. Готов работать за опыт, учиться и разбираться, как профессия устроена изнутри.</p>
    <p>Начинаю с людей: разговариваю с покупателями, разбираю сайты и только потом рисую.</p>
    <p>Сейчас осваиваю TouchDesigner и 3D в браузере — этот сайт собран на three.js.</p>
    <h3>Контакты</h3>
    <ul class="sheet__contacts">
      <li>Telegram — <a href="https://t.me/iwRRucTBMclts" target="_blank" rel="noopener">@iwRRucTBMclts</a></li>
      <li>Почта — <a href="mailto:nikolajsus199@gmail.com">nikolajsus199@gmail.com</a></li>
    </ul>
  </div>
</template>

<template id="sheet-imagine">
  <div class="sheet__media sheet__media--art" aria-hidden="true">
    <svg viewBox="0 0 120 80"><circle cx="50" cy="40" r="31"/><circle class="thin" cx="50" cy="40" r="25"/><circle class="thin" cx="50" cy="40" r="19"/><circle cx="50" cy="40" r="9"/><circle class="dot" cx="50" cy="40" r="1.6"/><path d="M99 10v27l-17 19"/><circle cx="99" cy="10" r="4"/></svg>
  </div>
  <div class="sheet__text">
    <p class="sheet__kicker">концепт · 2026 · кейс в работе</p>
    <h2>Imagine Club</h2>
    <p>Концепт редизайна сайта петербургского магазина пластинок. Сделан для портфолио, не по заказу магазина.</p>
    <ul>
      <li>Разобрал сайт по 21 скриншоту и поговорил с четырьмя собеседниками. Надёжнее всего подтвердилась проблема с поиском: по запросу «the weekend» среди первых восьми результатов нет ни одной из семи пластинок The Weeknd.</li>
      <li>Одна идея на весь концепт — пластинка как интерфейс: дорожки работают как меню, их ширина — длина песен, а состояние экземпляра видно по маленьким пластинкам.</li>
      <li>Сайт похож на открытый проигрыватель-чемодан: шапка — крышка, подвал — корпус, защёлка открывает поиск.</li>
      <li>Кликабельный прототип на три задачи — найти, выбрать из двух экземпляров, купить — для теста с пятью людьми.</li>
    </ul>
    <p class="sheet__note">Кейс с результатами теста появится здесь.</p>
  </div>
</template>

<template id="sheet-books">
  <div class="sheet__media sheet__media--art sheet__media--books" aria-hidden="true">
    <svg viewBox="0 0 120 80"><rect x="27" y="20" width="12" height="47" rx="2"/><rect x="41" y="13" width="14" height="54" rx="2"/><path class="thin" d="M44 23h8M44 57h8"/><rect x="57" y="24" width="10" height="43" rx="2"/><rect x="70" y="17" width="12" height="50" rx="2" transform="rotate(14 82 67)"/><path d="M17 67h86"/></svg>
  </div>
  <div class="sheet__text">
    <p class="sheet__kicker">исследование · сентябрь 2026</p>
    <h2>Как независимые книжные Петербурга говорят с читателем</h2>
    <p>Вопрос: как читатели находят книги и что им нужно от сайтов и соцсетей независимых книжных.</p>
    <ul>
      <li>Разобрал 6 магазинов: сайты, мобильные версии и соцсети.</li>
      <li>Провёл 4 интервью — с читателями и сотрудницей книжного — и собрал 4 открытые публикации 2025–2026 годов.</li>
    </ul>
    <p>Сила независимых книжных — люди и вкус, но онлайн их почти не видно: цену не объясняет ни один магазин из шести, а выбрать книги по автору можно только у одного.</p>
  </div>
</template>

<template id="sheet-grass">
  <div class="sheet__media sheet__media--art sheet__media--grass" aria-hidden="true">
    <svg viewBox="0 0 120 80"><path d="M20 72c2-18 0-34-6-48M30 72c0-20 4-38 14-52M41 72c1-14-2-27-9-38M52 72c1-22 6-40 17-55M62 72c0-13 3-25 10-33M73 72c-1-19-6-35-15-48M84 72c1-16 6-30 15-41M95 72c-1-12-4-22-10-30"/><path class="thin" d="M8 72h104"/></svg>
  </div>
  <div class="sheet__text">
    <p class="sheet__kicker">эксперимент · 2026</p>
    <h2>Трава</h2>
    <p>Десятки тысяч травинок считаются прямо в браузере: three.js и свой шейдер ветра. Курсор раздвигает траву, а ветер дует с той же силой и с той же стороны, что сейчас в Петербурге. Облака плывут туда же. Сверху видно, что луг стоит у моря.</p>
    <p>Кнопка «пейзаж» внизу справа переносит на горное плато: наползает туман, а когда он уходит — внизу долина с озером и горы вокруг. Рельеф строится из шума прямо в браузере.</p>
    <p>Если ничего не трогать пять минут, на траву прилетит божья коровка.</p>
    <p class="sheet__note">Данные о ветре — <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>, лицензия CC BY 4.0.</p>
  </div>
</template>

<template id="sheet-td">
  <div class="sheet__media sheet__media--art sheet__media--td" aria-hidden="true">
    <svg viewBox="0 0 120 80"><path d="M10 40c10-18 20-18 30 0s20 18 30 0 20-18 30 0"/><path class="thin" d="M10 50c10-14 20-14 30 0s20 14 30 0 20-14 30 0M10 30c10-22 20-22 30 0s20 22 30 0 20-22 30 0"/></svg>
  </div>
  <div class="sheet__text">
    <p class="sheet__kicker">скоро</p>
    <h2>TouchDesigner</h2>
    <p>Здесь появятся мои работы в TouchDesigner.</p>
  </div>
</template>
<!-- ========== конец панели ========== -->
</body>
</html>
